name: 🚀 CI/CD - Pull Request & Deploy

on:
  pull_request:
    branches: [ main ] # Kích hoạt chạy thử khi có Pull Request hướng về nhánh main
  
  push:
    branches: [ main ] # Hoặc chạy khi đã merge thành công vào main để deploy

jobs:
  build:
    name: 🐳 Build & Test Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Verify Docker Build for all services
        run: |
          docker compose -f src/docker-compose.prod.yaml build

  # JOB 2: Chỉ thực hiện deploy thật khi code ĐÃ ĐƯỢC MERGE vào nhánh main
  deploy:
    name: 🚀 Deploy to VPS Singapore
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Start/Update Containers
        run: |
          cd src
          docker compose -f docker-compose.prod.yaml up --build -d

      - name: 🧹 Cleanup unused Docker Images
        continue-on-error: true 
        run: |
          docker image prune -f

      - name: 📊 Verify status
        run: |
          cd src
          docker compose -f docker-compose.prod.yaml ps