name: .NET CI/CD Pipeline

on:
  push:
    branches:
      - main
    pull_request:
      - dev

jobs:
  # ==========================================
  # GIAI ĐOẠN CI: Chạy cho cả nhánh dev và main
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Kiểm tra và tải code từ kho chứa
        uses: actions/checkout@v4

      - name: Cài đặt môi trường .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Cập nhật lên .NET 9

      - name: Khôi phục NuGet và Biên dịch ứng dụng (Backend)
        run: |
          cd backend
          dotnet restore
          dotnet build --configuration Release --no-restore

      # Sử dụng lại GITHUB_TOKEN mặc định (không cần cấu hình token phụ)
      - name: Đăng nhập vào GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Đặt tag: nhánh main -> prod, nhánh dev -> dev
      # Chuyển TOÀN BỘ tên kho chứa (ví dụ: VaninBuuKun/H-c-CICD) sang viết thường
      - name: Xác định Tag và Tên Repo viết thường
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
             echo "tag=prod" >> $GITHUB_OUTPUT
          else
             echo "tag=dev" >> $GITHUB_OUTPUT
          fi
          echo "repo_lowercase=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Đặt Image theo cấu trúc: ghcr.io/owner/repository/image-name
      # GITHUB_TOKEN mặc định có toàn quyền với các Package gắn liền với repo này
      - name: Build & Push Docker Image BACKEND
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/student-backend:${{ steps.vars.outputs.tag }}

      - name: Build & Push Docker Image FRONTEND
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/student-frontend:${{ steps.vars.outputs.tag }}

  # ==========================================
  # GIAI ĐOẠN CD DEV: Chỉ chạy khi push vào nhánh dev
  # ==========================================
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref_name == 'dev'
    steps:
      - name: Kết nối SSH vào Server Dev và Cập nhật ứng dụng
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/app/dev
            cd ~/app/dev
            
            # Đăng nhập GHCR trên VPS (dùng Token cá nhân PAT để VPS có quyền kéo ảnh từ GitHub về)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            
            # Tải file docker-compose.deploy.yml phục vụ cho DEV từ nhánh dev
            curl -o docker-compose.yml -H "Authorization: token ${{ secrets.GHCR_PAT }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/dev/docker-compose.deploy.yml"
            
            # Khởi chạy bằng cách kéo image mới nhất về và cập nhật
            cat <<EOF > .env
            REGISTRY_OWNER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            PROJECT_ENV=dev
            FRONTEND_PORT=8081
            BACKEND_PORT=5001
            DB_PORT=5433
            DB_NAME=students_dev_db
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD || 'devsecretpassword' }}
            EOF
            
            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d

  # ==========================================
  # GIAI ĐOẠN CD PROD: Chỉ chạy khi push vào nhánh main
  # ==========================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref_name == 'main'
    steps:
      - name: Kết nối SSH vào Server Production và Cập nhật hệ thống
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/app/prod
            cd ~/app/prod
            
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            
            # Tải file docker-compose.deploy.yml phục vụ cho PROD từ nhánh main
            curl -o docker-compose.yml -H "Authorization: token ${{ secrets.GHCR_PAT }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.deploy.yml"
            
            # Khởi chạy bằng cách kéo image mới nhất về và cập nhật
            cat <<EOF > .env
            REGISTRY_OWNER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            PROJECT_ENV=prod
            FRONTEND_PORT=8080
            BACKEND_PORT=5000
            DB_PORT=5432
            DB_NAME=students_prod_db
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD || 'prodsecretpassword' }}
            EOF
            
            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d
