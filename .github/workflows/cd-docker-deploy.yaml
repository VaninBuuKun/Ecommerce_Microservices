name: 🚀 CI/CD - Build, Push & Deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt Docker Buildx (Bắt buộc để dùng cache nâng cao)
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Cấu hình Cache của GitHub Actions để giữ lại các layer build giữa các lần chạy
      - name: 📦 Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Gom chung logic Build bằng Docker Buildx tận dụng cache cho cả PR và Push
      - name: 🏗️ Build Docker Images (with Cache)
        uses: docker/bake-action@v5
        with:
          files: src/docker-compose.prod.yaml
          push: ${{ github.event_name == 'push' }} # Nếu là PR thì chỉ build kiểm tra, nếu là Push thì build xong đẩy thẳng lên GHCR
          set: |
            *.cache-from=type=local,src=/tmp/.buildx-cache
            *.cache-to=type=local,dest=/tmp/.buildx-cache,mode=max

  deploy:
    name: 🚀 Deploy to VPS Singapore
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Log in to GHCR on VPS
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 📥 Pull latest images from GHCR
        run: |
          cd src
          docker compose -f docker-compose.prod.yaml pull

      - name: 🚀 Start/Update Containers (No Build)
        run: |
          cd src
          docker compose -f docker-compose.prod.yaml up -d

      - name: 🧹 Cleanup unused Docker Images
        continue-on-error: true
        run: |
          docker image prune -f

      - name: 📊 Verify status
        run: |
          cd src
          docker compose -f docker-compose.prod.yaml ps