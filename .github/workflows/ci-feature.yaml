# =============================================================================
# CI — Feature Branch Validation (Build + Lint Only)
# =============================================================================
# Trigger: Push to any feature/* or feat/* branch
# Purpose: Fast feedback loop — validate code compiles before PR
# Actions: dotnet build + tsc --noEmit
# Does NOT: Build Docker images, Push to GHCR, Deploy to VPS
# =============================================================================

name: CI — Feature Branch Validation

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'

jobs:
  validate:
    name: Build & Lint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── .NET Backend Validation ──
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore Microservices.sln

      - name: Build Solution (Release)
        run: dotnet build Microservices.sln --no-restore --configuration Release

      # ── Frontend TypeScript Validation ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend-web

      - name: TypeScript Type Check
        run: npx tsc --noEmit
        working-directory: frontend-web

      - name: Lint Check
        run: npm run lint
        working-directory: frontend-web
