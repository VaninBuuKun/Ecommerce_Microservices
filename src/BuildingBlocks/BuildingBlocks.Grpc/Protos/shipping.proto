syntax = "proto3";

option csharp_namespace = "BuildingBlocks.Grpc.Services";

package shipping;

service ShippingGrpc {
  rpc GetLocationNames(GetLocationNamesRequest) returns (GetLocationNamesResponse);
  rpc CalculateBatchFee(CalculateBatchFeeGrpcRequest) returns (CalculateBatchFeeGrpcResponse);
}

message CalculateFeeItemRequest {
  int64 shop_id = 1;
  double weight = 2;
  double length = 3;
  double width = 4;
  double height = 5;
  int64 sender_ward_id = 6;
}

message CalculateBatchFeeGrpcRequest {
  repeated CalculateFeeItemRequest requests = 1;
  int64 recipient_ward_id = 2;
}

message CalculateFeeItemResponse {
  int64 shop_id = 1;
  bool is_success = 2;
  string fee = 3;
  string error_message = 4;
}

message CalculateBatchFeeGrpcResponse {
  repeated CalculateFeeItemResponse responses = 1;
}

message GetLocationNamesRequest {
  int64 province_id = 1;
  int64 district_id = 2;
  int64 ward_id = 3;
}

message GetLocationNamesResponse {
  string province_name = 1;
  string district_name = 2;
  string ward_name = 3;
  bool is_valid = 4;
}
