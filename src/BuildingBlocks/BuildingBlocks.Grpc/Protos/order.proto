syntax = "proto3";

option csharp_namespace = "BuildingBlocks.Grpc.Services";

package order;

service OrderGrpc {
  rpc GetCompletedSubOrderCountForProduct(GetCompletedSubOrderCountForProductRequest) returns (GetCompletedSubOrderCountForProductResponse);
  rpc GetSubOrderItemsForRebuy(GetSubOrderItemsForRebuyRequest) returns (GetSubOrderItemsForRebuyResponse);
  rpc CheckProductHasActiveSubOrders(CheckProductHasActiveSubOrdersRequest) returns (CheckProductHasActiveSubOrdersResponse);
  rpc CheckVariantOrders(CheckVariantOrdersRequest) returns (CheckVariantOrdersResponse);
}

message GetCompletedSubOrderCountForProductRequest {
  string customer_id = 1;
  string product_id = 2;
}

message GetCompletedSubOrderCountForProductResponse {
  int32 count = 1;
}

message GetSubOrderItemsForRebuyRequest {
  int64 sub_order_id = 1;
  int64 customer_id = 2;
}

message SubOrderItemRebuyDto {
  int64 variant_id = 1;
  int64 product_id = 2;
  int32 quantity = 3;
}

message GetSubOrderItemsForRebuyResponse {
  bool is_success = 1;
  string error_message = 2;
  repeated SubOrderItemRebuyDto items = 3;
}

message CheckProductHasActiveSubOrdersRequest {
  int64 product_id = 1;
}

message CheckProductHasActiveSubOrdersResponse {
  bool has_active_sub_orders = 1;
  string message = 2;
}

message CheckVariantOrdersRequest {
  int64 variant_id = 1;
}

message CheckVariantOrdersResponse {
  bool has_any_orders = 1;
  bool has_active_orders = 2;
  string message = 3;
}
