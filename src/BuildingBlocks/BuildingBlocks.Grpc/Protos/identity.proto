syntax = "proto3";

option csharp_namespace = "BuildingBlocks.Grpc.Services";

package identity;

service IdentityGrpc {
  rpc GetUserAddress(GetUserAddressRequest) returns (GetUserAddressResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  int64 user_id = 1;
}

message GetUserResponse {
  bool found = 1;
  int64 id = 2;
  string email = 3;
  string phone = 4;
  string first_name = 5;
  string last_name = 6;
  string avatar_url = 7;
}

message GetUserAddressRequest {
  int64 address_id = 1;
  int64 user_id = 2;
}

message GetUserAddressResponse {
  bool found = 1;
  string recipient_name = 2;
  string phone = 3;
  int64 province_id = 4;
  int64 district_id = 5;
  int64 ward_id = 6;
  string address_line = 7;
}
