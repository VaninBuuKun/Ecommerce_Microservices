  # ==========================================
  # 3. APPLICATION SERVICES (.NET 9 Microservices)
  # ==========================================
  identity-service:
    container_name: ecommerce_identity_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/identity-service:${TAG:-dev}

    build:
      context: ../
      dockerfile: src/Services/Identity/Identity.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres_db;Port=5432;Database=IdentityDb;Username=${POSTGRES_USER:-db_user};Password=${POSTGRES_PASSWORD:-123456};
      - Kestrel__Endpoints__Http__Url=http://+:5027
      - Kestrel__Endpoints__Grpc__Url=http://+:5028
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ecommerce.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      postgres_db:
        condition: service_healthy

  catalog-service:
    container_name: ecommerce_catalog_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/catalog-service:${TAG:-dev}

    build:
      context: ../
      dockerfile: src/Services/Catalogs/Ecommerce.Services.Catalog.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres_db;Port=5432;Database=ProductCatalogDb;Username=${POSTGRES_USER:-db_user};Password=${POSTGRES_PASSWORD:-123456};
      - IdentityUrl=http://identity-service:5027
      - Services__SellerGrpcUrl=http://seller-service:5043
      - Kestrel__Endpoints__Http__Url=http://+:5001
      - Kestrel__Endpoints__Grpc__Url=http://+:5002
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      postgres_db:
        condition: service_healthy

  cart-service:
    container_name: ecommerce_cart_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/cart-service:${TAG:-dev}

    build:
      context: ../
      dockerfile: src/Services/Carts/Ecommerce.Services.Carts.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=cart_db:6379,password=
      - Services__CatalogGrpcUrl=http://catalog-service:5002
      - Services__IdentityGrpcUrl=http://identity-service:5028
      - Kestrel__Endpoints__Http__Url=http://+:5004
      - Kestrel__Endpoints__Grpc__Url=http://+:5005
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      cart_db:
        condition: service_healthy

  order-service:
    container_name: ecommerce_order_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/order-service:${TAG:-dev}
    build:
      context: ../
      dockerfile: src/Services/Orders/Ecommerce.Services.Orders.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres_db;Port=5432;Database=OrderDb;Username=${POSTGRES_USER:-db_user};Password=${POSTGRES_PASSWORD:-123456};
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Port=5672
      - MessageBroker__Username=${RABBITMQ_USER:-guest}
      - MessageBroker__Password=${RABBITMQ_PASSWORD:-guest}
      - Services__CatalogGrpcUrl=http://catalog-service:5002
      - Services__CartGrpcUrl=http://cart-service:5005
      - Services__PaymentGrpcUrl=http://payment-service:5053
      - Kestrel__Endpoints__Http__Url=http://+:5007
      - Kestrel__Endpoints__Grpc__Url=http://+:5008
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    container_name: ecommerce_payment_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/payment-service:${TAG:-dev}
    build:
      context: ../
      dockerfile: src/Services/Payments/Ecommerce.Services.Payments.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres_db;Port=5432;Database=PaymentDb;Username=${POSTGRES_USER:-db_user};Password=${POSTGRES_PASSWORD:-123456};
      - Kestrel__Endpoints__Http__Url=http://+:5052
      - Kestrel__Endpoints__Grpc__Url=http://+:5053
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      postgres_db:
        condition: service_healthy

  seller-service:
    container_name: ecommerce_seller_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/seller-service:${TAG:-dev}
    build:
      context: ../
      dockerfile: src/Services/Sellers/Ecommerce.Services.Sellers.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres_db;Port=5432;Database=SellerDb;Username=${POSTGRES_USER:-db_user};Password=${POSTGRES_PASSWORD:-123456};
      - Kestrel__Endpoints__Http__Url=http://+:5042
      - Kestrel__Endpoints__Grpc__Url=http://+:5043
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      postgres_db:
        condition: service_healthy

  shipping-service:
    container_name: ecommerce_shipping_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/shipping-service:${TAG:-dev}
    build:
      context: ../
      dockerfile: src/Services/Shippings/Ecommerce.Services.Shippings.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres_db;Port=5432;Database=ShippingDb;Username=${POSTGRES_USER:-db_user};Password=${POSTGRES_PASSWORD:-123456};
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Port=5672
      - MessageBroker__Username=${RABBITMQ_USER:-guest}
      - MessageBroker__Password=${RABBITMQ_PASSWORD:-guest}
      - Kestrel__Endpoints__Http__Url=http://+:5070
      - Kestrel__Endpoints__Grpc__Url=http://+:5071
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    container_name: ecommerce_notification_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/notification-service:${TAG:-dev}
    build:
      context: ../
      dockerfile: src/Services/Notifications/Ecommerce.Services.Notifications.Api/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Port=5672
      - MessageBroker__Username=${RABBITMQ_USER:-guest}
      - MessageBroker__Password=${RABBITMQ_PASSWORD:-guest}
      - Kestrel__Endpoints__Http__Url=http://+:5080
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ==========================================
  # 4. REVERSE PROXY & API GATEWAY
  # ==========================================
  apigateway-service:
    container_name: ecommerce_apigateway_service
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/api-gateway:${TAG:-dev}
    build:
      context: ../
      dockerfile: src/ApiGateway/Ecommerce.ApiGateway/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:5027
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog-service:5001
      - ReverseProxy__Clusters__cart-cluster__Destinations__destination1__Address=http://cart-service:5004
      - ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=http://order-service:5007
      - ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address=http://payment-service:5052
      - ReverseProxy__Clusters__seller-cluster__Destinations__destination1__Address=http://seller-service:5042
      - ReverseProxy__Clusters__shipping-cluster__Destinations__destination1__Address=http://shipping-service:5070
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification-service:5080
      - Kestrel__Endpoints__Http__Url=http://+:5000
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - order-service
      - payment-service
      - seller-service
      - shipping-service
      - notification-service

  # ==========================================
  # 5. FRONTEND WEB CLIENT (Nginx + React 19)
  # ==========================================
  frontend-web:
    container_name: ecommerce_frontend_web
    image: ${REGISTRY_OWNER:-ghcr.io/vaninbuukun}/frontend-web:${TAG:-dev}
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 100M
    depends_on:
      - apigateway-service

volumes:
  postgres_data:
    driver: local
  redis_cart_data:
    driver: local
  minio_data:
    driver: local
  # loki_data:
  #   driver: local
  # tempo_data:
  #   driver: local
