services:
  # ==========================================
  # 1. DATABASES & INFRASTRUCTURE
  # ==========================================
  # Single PostgreSQL 16 Server (Chứa cả 6 Databases: IdentityDb, ProductCatalogDb, OrderDb, PaymentDb, SellerDb, ShippingDb)
  postgres_db:
    container_name: ecommerce_postgres_db
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-db_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - POSTGRES_MULTIPLE_DATABASES=IdentityDb,ProductCatalogDb,OrderDb,PaymentDb,SellerDb,ShippingDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-databases.sh:/docker-entrypoint-initdb.d/init-postgres-databases.sh:ro
      - ../scripts/migrations:/docker-entrypoint-initdb.d/migrations:ro


    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cart_db:
    container_name: ecommerce_cart_db
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_cart_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: ecommerce_rabbitmq
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: ecommerce_minio
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 200M

  # ==========================================
  # 2. LOGGING DASHBOARD (Dozzle Real-time Console Log Viewer)
  # ==========================================
  dozzle:
    container_name: ecommerce_dozzle
    image: amir20/dozzle:latest
    restart: always
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 30M

  # ==========================================
