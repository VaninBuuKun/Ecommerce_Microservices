#Mặc định gọi docker compose up -d sẽ gộp mặc định override vào 
services:
  product_db:
    container_name: ecommerce_product_db
    image: mysql:8.4
  
  cart_db:
    container_name: ecommerce_cart_db
    image: redis:7.4
    
  postgres_db:
    container_name: ecommerce_postgres_db
    image: postgres:16-alpine

  rabbitmq:
    container_name: ecommerce_rabbitmq
    image: rabbitmq:3-management

  elasticsearch:
    container_name: ecommerce_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0

  kibana:
    container_name: ecommerce_kibana
    image: docker.elastic.co/kibana/kibana:8.12.0
  minio:
    container_name: ecommerce_minio
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest