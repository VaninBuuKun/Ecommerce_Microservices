  minio:
    container_name: ecommerce_minio
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    restart: always
    
    ports:
      # S3 API
      - "9000:9000"
      
      # MinIO Console
      - "9001:9001"
    
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    
    # Khởi động MinIO và mở Web Console tại port 9001.
    command: server /data --console-address ":9001"
    
    volumes:
      - minio_data:/data
    
    mem_limit: 256m
  
