services:
  cart_db:
    container_name: ecommerce_cart_db
    image: redis:7.4
    restart: always
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis_cart_data:/data
    
    # Ghi đè command mặc định của Redis.
    #
    # Bật AOF (Append Only File) để Redis ghi dữ liệu xuống đĩa.
    # Giúp phục hồi dữ liệu sau restart/crash.
    command: redis-server --appendonly yes
  
  postgres_db:
    container_name: ecommerce_postgres_db
    image: postgres:16-alpine
    restart: always
    
    environment:
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=123456
      
      # Database mặc định PostgreSQL tạo khi khởi động.
      - POSTGRES_DB=OrderDb
      
      # Biến custom được script init đọc để tạo thêm DB:
      # - IdentityDb
      # - PaymentDb
      # - SellerDb
      # - ShippingDb
      - POSTGRES_MULTIPLE_DATABASES=IdentityDb,PaymentDb,SellerDb,ShippingDb
    
    ports:
      - "5433:5432"
    
    volumes:
      # Persist dữ liệu PostgreSQL.
      - postgres_shared_data:/var/lib/postgresql/data
      
      # Script chỉ chạy lần đầu khi volume còn trống.
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
  
  rabbitmq:
    container_name: ecommerce_rabbitmq
    image: rabbitmq:3-management
    restart: always
    
    ports:
      # AMQP Port
      - "5672:5672"
      
      # RabbitMQ Management UI
      - "15672:15672"
    
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
  
