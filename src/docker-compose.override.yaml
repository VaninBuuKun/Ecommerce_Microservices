services:
  product_db:
    container_name: ecommerce_product_db
    restart: always

    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=ProductCatalogDb
      - MYSQL_USER=db_user
      - MYSQL_PASSWORD=123456

    ports:
      - "3308:3306"
    volumes:
      - mysql_product_data:/var/lib/mysql

  cart_db:
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_cart_data:/data

    #lệnh này ghì đè lệnh khởi động mặc định của container 
    #-> ghi nhớ các lệnh trước đó để thực hiện lại, vì khi stop sẽ mất hết dữ liệu do lưu trên Ram.
    command: redis-server --appendonly yes

  order_db:
    container_name: ecommerce_order_db
    restart: always
    environment:
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=OrderDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data

  rabbitmq:
    container_name: ecommerce_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  identity_db:
    container_name: ecommerce_identity_db
    restart: always
    environment:
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=IdentityDb
    ports:
      - "5434:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data

  payment_db:
    container_name: ecommerce_payment_db
    restart: always
    environment:
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=PaymentDb
    ports:
      - "5435:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  seller_db:
    container_name: ecommerce_seller_db
    restart: always
    environment:
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=SellerDb
    ports:
      - "5436:5432"
    volumes:
      - postgres_seller_data:/var/lib/postgresql/data

  shipping_db:
    container_name: ecommerce_shipping_db
    restart: always
    environment:
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=ShippingDb
    ports:
      - "5437:5432"
    volumes:
      - postgres_shipping_data:/var/lib/postgresql/data

  elasticsearch:
    container_name: ecommerce_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    container_name: ecommerce_kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  mysql_product_data:
    driver: local
  postgres_order_data:
    driver: local
  redis_cart_data:
    driver: local
  postgres_identity_data:
    driver: local
  postgres_payment_data:
    driver: local
  postgres_seller_data:
    driver: local
  postgres_shipping_data:
    driver: local
  elasticsearch_data:
    driver: local
