#      - discovery.type=single-node
#      - xpack.security.enabled=false
#      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
#    ports:
#      - "9200:9200"
#      - "9300:9300"
#    volumes:
#      - elasticsearch_data:/usr/share/elasticsearch/data
#    mem_limit: 1g
#
#  kibana:
#    container_name: ecommerce_kibana
#    restart: always
#    environment:
#      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
#    ports:
#      - "5601:5601"
#    depends_on:
#      - elasticsearch
#    mem_limit: 512m

  minio:
    container_name: ecommerce_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    mem_limit: 256m

#  aspire-dashboard:
#    container_name: aspire-dashboard
#    restart: always
#    ports:
#      - "18888:18888" # Cổng giao diện UI mới (đẹp và hiện đại hơn nhiều)
#      - "4317:4317"   # Cổng OTLP gRPC để nhận trace/metrics từ .NET service đẩy lên
#    environment:
#      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true # Cho phép truy cập không cần token đăng nhập cho dễ test local
  
  otel-collector:
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml #bind file to file
    ports:
      - "4317:4317" # Cổng gRPC để .NET đẩy dữ liệu vào

  loki:
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  grafana:
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Mật khẩu đăng nhập mặc định là admin
  tempo:
    restart: always
    user: "0:0"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
volumes:
  mysql_product_data:
    driver: local
  postgres_shared_data:
    driver: local
  redis_cart_data:
    driver: local
  elasticsearch_data:
    driver: local
  minio_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
